{% extends "base.html" %}
{% block content %}
<section class="hero" style="max-width: 400px; margin: auto; padding: 40px; background: #1e293b; border-radius: 16px; border: 1px solid #334155;">
  <h1 style="text-align: center; font-size: 2rem; color: #f8fafc; margin-top: 0;">Đăng nhập</h1>
  <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">Hệ thống Smart Garden</p>
  
  <!-- NƠI HIỂN THỊ LỖI NẾU CÓ -->
  {% if error %}
  <div style="background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold;">
      ⚠️ {{ error }}
  </div>
  {% endif %}

  <!-- NƠI HIỂN THỊ THÀNH CÔNG NẾU CÓ -->
  {% if success %}
  <div style="background: #14532d; border: 1px solid #22c55e; color: #86efac; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold;">
      ✅ {{ success }}
  </div>
  {% endif %}

  <form action="/api/login" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
    <div>
        <label style="font-weight: bold; color: #cbd5e1;">Email</label>
        <input type="email" name="email" value="admin@gmail.com" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-top: 8px;">
    </div>
    <div>
        <label style="font-weight: bold; color: #cbd5e1;">Mật khẩu</label>
        <input type="password" name="password" value="123456" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-top: 8px;">
    </div>
    <button type="submit" style="padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px;">Đăng Nhập</button>
    <a href="/register" style="text-align: center; color: #94a3b8; text-decoration: none; margin-top: 10px;">Chưa có tài khoản? <span style="color: #38bdf8;">Đăng ký ngay</span></a>
  </form>
</section>
{% endblock %}
