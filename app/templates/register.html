{% extends "base.html" %}
{% block content %}
<section class="hero" style="max-width: 400px; margin: auto; padding: 40px;">
  <h1 style="text-align: center; font-size: 2rem;">Đăng ký</h1>
  <form action="/api/register" method="POST" style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
    <div>
        <label style="font-weight: bold;">Email</label>
        <input type="email" name="email" required style="width: 100%; padding: 10px; border-radius: 5px;">
    </div>
    <div>
        <label style="font-weight: bold;">Password</label>
        <input type="password" name="password" required style="width: 100%; padding: 10px; border-radius: 5px;">
    </div>
    <button type="submit" style="padding: 12px; background: #2563eb; color: white; border-radius: 5px; cursor: pointer;">Tạo tài khoản</button>
    <a href="/login" style="text-align: center; color: var(--text);">Đã có tài khoản? Đăng nhập</a>
  </form>
</section>
{% endblock %}
