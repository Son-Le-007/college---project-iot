{% extends "base.html" %}

{% block content %}
<!-- Căn giữa màn hình và giới hạn chiều rộng -->
<div style="max-width: 400px; margin: 60px auto;">
  
  <div class="text-center mb-6">
    <h1 style="font-size: 2rem;">Đăng nhập</h1>
    <p>Hệ thống Smart Garden</p>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert alert-error text-center">
        ⚠️ {{ error }}
      </div>
    {% endif %}

    {% if success %}
      <div class="alert alert-success text-center">
        ✅ {{ success }}
      </div>
    {% endif %}

    <!-- FORM ĐĂNG NHẬP -->
    <form action="/api/login" method="POST" class="flex flex-col gap-4">
      <div>
        <label class="form-label">Email</label>
        <!-- Form control xịn: Có bo góc, hover sáng viền -->
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      
      <div>
        <label class="form-label">Mật khẩu</label>
        <input type="password" name="password" class="form-control" placeholder="••••••" required>
      </div>
      
      <button type="submit" class="btn btn-primary mt-4" style="width: 100%;">
        Đăng Nhập
      </button>

      <div class="text-center mt-4">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Chưa có tài khoản?</span>
        <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.9rem;">
          Đăng ký ngay
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
