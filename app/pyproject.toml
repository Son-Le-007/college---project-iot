[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "college-project-iot-app"
version = "0.1.0"
description = "SSR app for the college IoT project"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.31.0",
  "fastapi>=0.139.0",
  "google-genai>=1.53.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "mysql-connector-python>=9.5.0",
  "paho-mqtt>=2.1.0",
  "pandas>=2.3.3",
  "pyserial>=3.5",
  "python-dotenv>=1.2.1",
  "sqlalchemy>=2.0.51",
  "supabase>=2.31.0",
  "uvicorn[standard]>=0.51.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
