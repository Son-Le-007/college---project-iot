{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
  
  <div class="text-center mb-6">
    <h1 style="font-size: 2rem;">Đăng ký</h1>
    <p>Tạo tài khoản hệ thống</p>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert alert-error text-center">
        ⚠️ {{ error }}
      </div>
    {% endif %}
    <form action="/api/register" method="POST" class="flex flex-col gap-4">
      <div>
        <label class="form-label">Địa chỉ Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      
      <div>
        <label class="form-label">Mật khẩu bảo mật</label>
        <input type="password" name="password" class="form-control" placeholder="Từ 6 ký tự trở lên" required>
      </div>
      
      <button type="submit" class="btn btn-primary mt-4" style="width: 100%; background-color: var(--text-main);">
        Tạo Tài Khoản
      </button>

      <div class="text-center mt-4">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Đã có tài khoản?</span>
        <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.9rem;">
          Về Đăng nhập
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
